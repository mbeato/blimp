name: Blimp
options:
  bundleIdPrefix: dev.blimp
  deploymentTarget:
    iOS: "26.0"
packages:
  BlimpKit:
    path: BlimpKit
targets:
  Blimp:
    type: application
    platform: iOS
    sources: [Blimp, Live]
    dependencies:
      - package: BlimpKit
      - target: BlimpWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blimp.phone
        PRODUCT_NAME: blimp
        MARKETING_VERSION: "0.3.12"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    # Notifications: Apple's sandbox service for a build from Xcode or the simulator, production for TestFlight; the
    # App Group the widgets share. XcodeGen writes the file (it's ignored, as Info.plist is).
    entitlements:
      path: Blimp/Blimp.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [group.dev.blimp.phone]
    info:
      path: Blimp/Info.plist
      properties:
        CFBundleDisplayName: blimp
        # A widget's tap opens blimp://open?session=<name> (WidgetLink).
        CFBundleURLTypes:
          - CFBundleURLName: dev.blimp.phone
            CFBundleURLSchemes: [blimp]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: blimp locks with Face ID because it can run anything on your server.
        NSMicrophoneUsageDescription: blimp listens while you hold the mic button, to type what you say.
        NSSpeechRecognitionUsageDescription: blimp turns what you say into text on this iPhone.
        NSCameraUsageDescription: blimp uses the camera to scan the pairing code from your server.
        # The live panel (LiveShare.swift), a Live Activity that blimpd's pushes start and update. Frequent updates:
        # a needs-you goes at priority 10, which iOS otherwise limits.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Only HTTPS and the system's own encryption, so TestFlight needn't ask about export rules for each build.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost: { NSExceptionAllowsInsecureHTTPLoads: true }
            127.0.0.1: { NSExceptionAllowsInsecureHTTPLoads: true }
  # The widgets (BlimpWidgets/): every project's sessions on the home screen and the lock screen. Swift 5 language
  # mode: WidgetKit's TimelineProvider hands over completion handlers that aren't Sendable, and Swift 6 won't let the
  # Task that fetches GET /widget carry them.
  BlimpWidgets:
    type: app-extension
    platform: iOS
    sources: [BlimpWidgets]
    dependencies:
      - package: BlimpKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blimp.phone.widgets
        PRODUCT_NAME: BlimpWidgets
        MARKETING_VERSION: "0.3.12"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    # Widget push (blimpd's pings) and the App Group the app shares. XcodeGen writes both files (they're ignored).
    entitlements:
      path: BlimpWidgets/BlimpWidgets.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [group.dev.blimp.phone]
    info:
      path: BlimpWidgets/Info.plist
      properties:
        CFBundleDisplayName: blimp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost: { NSExceptionAllowsInsecureHTTPLoads: true }
            127.0.0.1: { NSExceptionAllowsInsecureHTTPLoads: true }
  # Drives the app in the simulator against a real blimpd: the app-e2e job in .github/workflows/ios.yml.
  BlimpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BlimpUITests]
    dependencies:
      - target: Blimp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blimp.phone.uitests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blimp
schemes:
  Blimp:
    build:
      targets: { Blimp: all }
  BlimpUITests:
    build:
      targets: { Blimp: all, BlimpUITests: [test] }
    test:
      targets: [BlimpUITests]
