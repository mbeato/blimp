name: Idea
description: Something blimp could do, or could do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, and where blimp gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it. A rough idea is fine.
  - type: textarea
    id: now
    attributes:
      label: What you do now
      description: Your way around it today, if you have one.
