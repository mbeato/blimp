name: iOS

# The iPhone app: its logic (BlimpKit) is tested on Linux and macOS; the app is built for the simulator,
# and run there against a real blimpd with stand-in Claude sessions (app-e2e, on main, a manual run, and
# branches that change the iPhone app; see e2e-check). A release tag (v*) also
# uploads it to TestFlight, once the App Store Connect secrets are set (testflight), and so does a manual run.
on:
  push:
    branches: ["**"]
    # GitHub doesn't check paths for tag pushes: every v* tag runs this.
    tags: ["v*"]
    paths: ["ios/**", "src/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the e2e runs: auto (GitHub's Macs, or the Mac when E2E_ON_MAC is set and it's online), mac, or github"
        type: choice
        options: [auto, mac, github]
        default: auto
      testflight:
        description: "Upload to TestFlight too"
        type: boolean
        default: true
      layout:
        description: "The layout and gesture tests too (before a release)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a branch cancels the branch's push run still going. Main, tags and manual runs never: each
# run is its own.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether this run has the end-to-end test (app-e2e): main and manual runs always; a branch only if it
  # changes the iPhone app (ios/ or this file, against main), since main runs it on every merge anyway; a
  # tag never, since its commit was tested on main (and testflight doesn't wait for it).
  # And where: GitHub's Macs, unless a manual run picks the Mac, or the repository variable E2E_ON_MAC is true
  # (gh variable set E2E_ON_MAC --body true). Then Max's MacBook Pro (three self-hosted runners labeled
  # blimp-e2e, ios/README.md), for the owner's own pushes and manual runs, when it's online. Whether it's online
  # needs the RUNNERS_TOKEN secret (read-only Administration); without it, those runs wait for the Mac.
  e2e-check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      runs-on: ${{ steps.check.outputs.runs-on }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_TOKEN: ${{ secrets.RUNNERS_TOKEN }}
          PICK: ${{ inputs.runner || 'auto' }}
          ON_MAC: ${{ vars.E2E_ON_MAC }}
          LAYOUT: ${{ inputs.layout || false }}
        run: |
          run=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            run=true
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --paginate -q '.files[].filename')
            if grep -qE '^(ios/|\.github/workflows/ios\.yml$)' <<< "$files"; then run=true; fi
          fi
          [ "$run" = true ] || echo "::notice title=iPhone e2e::Skipped: this branch doesn't change ios/ (main runs it after the merge; Run workflow runs it now)."
          echo "run=$run" >> "$GITHUB_OUTPUT"
          mac='["self-hosted","blimp-e2e"]'
          on='"macos-latest"'
          if [ "$PICK" = mac ]; then
            on=$mac
          elif [ "$PICK" = auto ] && [ "$ON_MAC" = true ] && [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ]; then
            if [ -z "$RUNNERS_TOKEN" ]; then
              on=$mac
            else
              n=$(GH_TOKEN="$RUNNERS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runners" \
                -q '[.runners[] | select(.status == "online" and ([.labels[].name] | index("blimp-e2e")))] | length' || echo 0)
              if [ "$n" -gt 0 ]; then on=$mac; else echo "::notice title=iPhone e2e::The Mac's runners are offline: on GitHub's Macs."; fi
            fi
          fi
          echo "runs-on=$on" >> "$GITHUB_OUTPUT"
          echo "the e2e runs on $on"
          # The shards: core tests always (what reaches Claude's sessions, starting, ending, resuming and
          # reconnecting, the lock), about 3.8 min each on GitHub's Macs by run 39997381577; the layout and gesture
          # tests (the drawer's swipe, the inbox's top bar, New session, the browser tab, the project strip, opening a folder) only when asked,
          # before a release. test1 pairs, test2 needs a paired app to find it locked, and testInbox runs after test1 read
          # demo-chat: they stay together. Each shard's first test pairs (launchPaired does when it isn't). Each
          # has its own ports, so shards can share a Mac. Three on GitHub's Macs; two on the Mac, a laptop that
          # also runs its owner's apps (three slowed its tests to half speed).
          shard() { # name port site core-tests layout-tests
            t=$4
            [ "$LAYOUT" != true ] || t="$t $5"
            jq -nc --arg s "$1" --argjson p "$2" --argjson w "$3" --arg t "$t" '{shard: $s, port: $p, site: $w, tests: $t}'
          }
          if [ "$on" = "$mac" ]; then
            shard a 7425 7431 "test1PairChatAndAnswer test2FaceIDLock test3Stop test7AnswerQuestions test8TrustFolder testStuckStart" "test9DrawerFromASwipe testInbox"
            shard b 7426 7432 "test4StartAndEnd test5Resume test6Reconnect testDraftKeptThroughRelock testNeedsYouAllowFromTheInbox testPushOpensTheChat testWidgetLinkOpensTheChat testFeed" "testNewSessionFromTheDrawer testSwitchProjectFromTheStrip testOpenFolder testServerBrowserTab"
          else
            shard a 7425 7431 "test1PairChatAndAnswer test2FaceIDLock test8TrustFolder testStuckStart" "test9DrawerFromASwipe testInbox"
            shard b 7426 7432 "test4StartAndEnd test5Resume test6Reconnect testPushOpensTheChat testWidgetLinkOpensTheChat" "testNewSessionFromTheDrawer testSwitchProjectFromTheStrip testOpenFolder"
            shard c 7427 7433 "test3Stop test7AnswerQuestions testDraftKeptThroughRelock testNeedsYouAllowFromTheInbox testFeed" "testServerBrowserTab"
          fi | jq -sc '{include: .}' > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          cat matrix.json
          # Every UI test is in a shard's list (core or layout): a new one that isn't would never run.
          if [ "$run" = true ]; then
            raw=(-H "Accept: application/vnd.github.raw")
            gh api "${raw[@]}" "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ios.yml?ref=$GITHUB_SHA" > ios.yml
            gh api "${raw[@]}" "repos/$GITHUB_REPOSITORY/contents/ios/BlimpUITests/BlimpUITests.swift?ref=$GITHUB_SHA" > ui.swift
            listed=$(grep -E '^ +shard [a-z] ' ios.yml | grep -oE 'test[A-Za-z0-9]+' | sort -u)
            missing=$(grep -oE 'func test[A-Za-z0-9]+' ui.swift | cut -c6- | sort -u | comm -23 - <(echo "$listed"))
            [ -z "$missing" ] || { echo "::error title=iPhone e2e::In no shard's list in e2e-check (ios.yml), so never run: $(echo $missing)"; exit 1; }
          fi

  kit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - name: BlimpKit tests
        working-directory: ios/BlimpKit
        run: swift test
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The iOS 26 SDK comes with Xcode 26; use the newest Xcode 26 the runner has.
      - name: Pick Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"
          xcodebuild -version
      - run: ios/install-xcodegen.sh
      - name: BlimpKit tests on macOS
        working-directory: ios/BlimpKit
        run: swift test
      # Swift warnings fail the build, for good (5a9b30a said "reverted next"; it stays).
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Blimp.xcodeproj -scheme Blimp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build | tail -80

  # The app in the simulator, driven by ios/BlimpUITests, against this branch's blimpd with stand-in Claude
  # sessions (ios/e2e/setup.ts) and a stand-in claude for the sessions it starts (ios/e2e/bin). blimpd listens
  # on a unix socket; ios/e2e/forward.py forwards 127.0.0.1:$E2E_PORT to it, as the SSH tunnel does on a Mac.
  # Three shards at once, each with its own blimpd, stand-ins, simulator, folders and ports (so all three can
  # share Max's Mac), each running some of the tests in name order; a test that fails is run once more before
  # it fails the job. Screenshots and logs go in the iphone-e2e-<shard> artifact.
  app-e2e:
    name: app-e2e (${{ matrix.shard }})
    needs: e2e-check
    if: needs.e2e-check.outputs.run == 'true'
    runs-on: ${{ fromJSON(needs.e2e-check.outputs.runs-on) }}
    # All 15 tests on one Mac took 25-28 min (a slow runner went past 25 three times); a shard runs a third.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # which tests each shard runs, and its ports: e2e-check
      matrix: ${{ fromJSON(needs.e2e-check.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      # The simulator's iOS, on GitHub's Macs (Xcode 26) and the Mac (Xcode 27) alike: what TestFlight builds for.
      # The Mac's first run, on iOS 27, failed the lock tests (iOS 27 still shows Home under the cover to them).
      IOS: "26"
      E2E_DIR: /tmp/be-${{ matrix.shard }}
      # zmx 0.8 limits session names by the length of its socket folder's path: keep it short.
      ZMX_DIR: /tmp/zx-${{ matrix.shard }}
      BLIMPD_SOCKET: /tmp/be-${{ matrix.shard }}/b/blimpd.sock
      CLAUDE_CONFIG_DIR: /tmp/be-${{ matrix.shard }}/claude
      E2E_PORT: ${{ matrix.port }}
      E2E_SITE_PORT: ${{ matrix.site }}
      TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zmx
        run: |
          f=zmx-0.8.1-macos-aarch64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/neurosnap/zmx/releases/download/v0.8.1/$f"
          echo "1d86b1c9fba47fa707a6f0e976b20510b07c1c26d0ed010b9414b2a2c5e6beef  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zmx-bin"
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/zmx-bin" zmx
          echo "$RUNNER_TEMP/zmx-bin" >> "$GITHUB_PATH"
      # On the Mac, the last run's folders and anything a cancelled run left. Its compiled app stays (DD), so
      # only what changed is built again.
      - name: Start clean
        run: |
          ios/e2e/stop.sh
          # .noindex: Spotlight leaves it alone (it indexed the first run's build at full speed)
          cache="$HOME/Library/Caches/blimp-e2e.noindex/$SHARD"
          rm -rf "$E2E_DIR" "$ZMX_DIR" "$cache/e2e-work"
          mkdir -p "$E2E_DIR" "$ZMX_DIR" "$cache"
          chmod 700 "$ZMX_DIR"
          echo "E2E_WORK=$cache/e2e-work" >> "$GITHUB_ENV"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then dd="$cache/dd"; else dd="$RUNNER_TEMP/dd"; fi
          echo "DD=$dd" >> "$GITHUB_ENV"
      - name: Pick Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"
          xcodebuild -version
      # The shard's own iPhone, booting while the tests build. Made on a fresh GitHub runner (minutes to boot);
      # on the Mac, kept from the last run and not wiped: a boot after a wipe took 2 min and set Apple's own apps'
      # first-boot crashes off on the Mac's screen, one without takes 10 s. Only blimp's app and the Keychain
      # (the pairing) are reset, once it's up (Wait for the simulator). The newest iOS $IOS there is, on the
      # first iPhone model it lists.
      - name: Start an iPhone simulator booting
        run: |
          read -r have id rt <<< "$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          name = "blimp-e2e-" + sys.argv[1]
          devs = json.load(sys.stdin)["devices"]
          ver = lambda r: [int(x) for x in re.findall(r"\d+", r.split("iOS-")[1])]
          for r in sorted((r for r in devs if "SimRuntime.iOS-" + sys.argv[2] + "-" in r), key=ver, reverse=True):
              phones = [d for d in devs[r] if d["name"].startswith("iPhone")]
              mine = [d for d in devs[r] if d["name"] == name]
              if mine: print("have", mine[0]["udid"], r); break
              if phones: print("new", phones[0]["deviceTypeIdentifier"], r); break
          ' "$SHARD" "$IOS")"
          [ -n "$have" ] || { echo "::error::No iOS $IOS simulator with an iPhone here (xcodebuild -downloadPlatform iOS -buildVersion $IOS.x)"; xcrun simctl list runtimes; exit 1; }
          if [ "$have" = have ]; then
            sim=$id
          else
            sim=$(xcrun simctl create "blimp-e2e-$SHARD" "$id" "$rt")
          fi
          echo "SIM=$sim ($rt)"
          echo "SIM=$sim" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$sim" > "$E2E_DIR/boot.log" 2>&1 &
      - run: ios/install-xcodegen.sh
      # Swift warnings fail the build, for good (5a9b30a said "reverted next"; it stays).
      - name: Build the UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Blimp.xcodeproj -scheme BlimpUITests -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath "$DD" CODE_SIGN_IDENTITY=- SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build-for-testing 2>&1 | tail -40
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # npx: blimpd gives the sessions it starts the server browser's tools only when the login shell finds it
      # (the check expects them). GitHub's Macs have it; the Mac's runners start with a bare PATH.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install
      - name: Start blimpd, the stand-in sessions and the forward
        run: |
          # with the stand-in login shell and claude (ios/e2e/bin), for the sessions the app starts
          ios/e2e/blimpd.sh
          token="$(dirname "$BLIMPD_SOCKET")/token"
          # the browser tab's page (setup.ts writes it), for blimpd's Chrome (Google Chrome's app on the Mac)
          mkdir -p "$E2E_DIR/site"
          nohup python3 -m http.server "$E2E_SITE_PORT" --bind 127.0.0.1 --directory "$E2E_DIR/site" > "$E2E_DIR/site.log" 2>&1 &
          echo $! > "$E2E_DIR/site.pid"
          bun ios/e2e/setup.ts
          nohup python3 ios/e2e/forward.py "$E2E_PORT" "$BLIMPD_SOCKET" > "$E2E_DIR/forward.log" 2>&1 &
          echo $! > "$E2E_DIR/forward.pid"
          # Python can take a few seconds to start on a busy runner
          for _ in $(seq 50); do
            code=0
            curl -fsS -o /dev/null "http://127.0.0.1:$E2E_PORT/" 2>/dev/null || code=$?
            [ "$code" = 7 ] || break # 7: nothing listening yet; anything else is the forward answering
            sleep 0.2
          done
          curl -fsS -H "Authorization: Bearer $(cat "$token")" "http://127.0.0.1:$E2E_PORT/sessions" || { cat "$E2E_DIR/forward.log"; exit 1; }
          echo
      - name: Wait for the simulator
        run: |
          # -b: boots it, if the boot started above didn't
          xcrun simctl bootstatus "$SIM" -b
          cat "$E2E_DIR/boot.log"
          # What the last run left on a kept simulator (the Mac's): the app, with its settings, and the pairing
          xcrun simctl uninstall "$SIM" dev.blimp.phone 2>/dev/null || true
          xcrun simctl keychain "$SIM" reset
          # The keyboard's swipe-typing introduction would cover the keys the test types with.
          xcrun simctl spawn "$SIM" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          # Face ID enrolled: the simulator counts as having a passcode, so a paired launch is locked, and
          # the test unlocks it with a matching face (ios/e2e/signals.sh) rather than a passcode it can't type.
          xcrun simctl spawn "$SIM" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$SIM" notifyutil -p com.apple.BiometricKit.enrollmentChanged
      - name: UI test
        working-directory: ios
        run: |
          # xcodebuild passes TEST_RUNNER_<name> to the test as <name>.
          export TEST_RUNNER_BLIMP_LINK="$(cat "$E2E_DIR/link")" TEST_RUNNER_E2E_DIR="$E2E_DIR"
          # restarts blimpd and drives Face ID when the test asks (ios/e2e/signals.sh)
          nohup ../ios/e2e/signals.sh > "$E2E_DIR/signals.log" 2>&1 &
          echo $! > "$E2E_DIR/signals.pid"
          log="$E2E_DIR/xcodebuild.log"
          only=()
          for t in $TESTS; do only+=("-only-testing:BlimpUITests/BlimpUITests/$t"); done
          # Each test's start and end print as they happen (the whole log still goes to $log), so a run that
          # hits the job's time limit shows which test it was in; before, a cancelled run printed nothing.
          xcodebuild -project Blimp.xcodeproj -scheme BlimpUITests -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath "$DD" -resultBundlePath "$E2E_DIR/e2e.xcresult" "${only[@]}" \
            -retry-tests-on-failure -test-iterations 2 test-without-building > "$log" 2>&1 &
          xb=$!
          tail -n +1 -f "$log" | grep --line-buffered -E "Test Case|Executed|\*\* TEST" &
          shown=$!
          # Xcode 27.1 on the Mac once sat idle for 10 minutes after the last test without ending (run
          # 40013319082): once every test has its last word and the log has been quiet for a minute, it's
          # stopped, and the tests' results decide (ios/e2e/results.py).
          verdict=
          while kill -0 "$xb" 2>/dev/null; do
            sleep 5
            [ "$(python3 ../ios/e2e/results.py "$log" $TESTS)" != running ] || continue
            [ $(( $(date +%s) - $(stat -f %m "$log") )) -ge 60 ] || continue
            echo "::warning title=iPhone e2e::xcodebuild still ran a minute after the last test's result: stopped, and the results decide"
            kill "$xb"
            verdict=$(python3 ../ios/e2e/results.py "$log" $TESTS)
            break
          done
          code=0
          wait "$xb" || code=$?
          sleep 1
          kill "$shown" 2>/dev/null || true
          [ -n "$verdict" ] || { [ "$code" = 0 ] && verdict=passed || verdict=failed; }
          if [ "$verdict" = passed ]; then
            # Passed on its second go: said, so a flaky test stays in sight.
            { grep -oE "Test Case '-\[BlimpUITests\.BlimpUITests [A-Za-z0-9]+\]' failed" "$log" || true; } | sed -E 's/.*BlimpUITests ([A-Za-z0-9]+)\].*/\1/' | sort -u |
              while read -r t; do echo "::warning title=iPhone e2e::$t failed, then passed when run again"; done
          else
            grep -E " error: | warning: |Test Case|timed out|failed|\*\* TEST" "$log" | head -120
            grep -A80 "^SCREEN at" "$log" | head -400
            tail -40 "$log"
            exit 1
          fi
      - name: Check what reached the stand-in sessions
        run: ios/e2e/check.sh $TESTS
      - name: Export screenshots
        if: always()
        run: |
          [ -d "$E2E_DIR/e2e.xcresult" ] || exit 0
          out="$E2E_DIR/screenshots"
          mkdir -p "$out"
          # A bundle xcodebuild didn't finish (stopped after a hang, UI test) has none to give
          xcrun xcresulttool export attachments --path "$E2E_DIR/e2e.xcresult" --output-path "$out" || { echo "no screenshots: the result bundle isn't complete"; exit 0; }
          # Name each file as the test named it.
          python3 -c '
          import json, os, re, shutil, sys
          d = sys.argv[1]
          # upload-artifact refuses names with quotes and the like
          safe = lambda n: re.sub(r"[^A-Za-z0-9._-]+", "_", n)
          for t in json.load(open(os.path.join(d, "manifest.json"))):
              for a in t.get("attachments", []):
                  src, name = os.path.join(d, a["exportedFileName"]), a.get("suggestedHumanReadableName")
                  if name and os.path.exists(src): os.rename(src, os.path.join(d, safe(name)))
          for n in os.listdir(d):
              # the failure records Xcode adds by itself (element queries, UI snapshots) stay in the .xcresult only
              if n.startswith(("Debug description", "App UI hierarchy", "UI Snapshot", "Debug_description", "App_UI_hierarchy", "UI_Snapshot")):
                  p = os.path.join(d, n)
                  shutil.rmtree(p) if os.path.isdir(p) else os.remove(p)
                  continue
              if safe(n) != n: os.rename(os.path.join(d, n), os.path.join(d, safe(n)))
          ' "$out" || true
          ls "$out"
      - name: blimpd's log
        if: failure()
        run: |
          cat "$E2E_DIR/blimpd.log" || true
          cat "$E2E_DIR/forward.log" || true
          cat "$E2E_DIR/signals.log" || true
          mkdir -p "$E2E_DIR/zmx-logs"
          find "$ZMX_DIR" -name "*.log" -exec cp {} "$E2E_DIR/zmx-logs/" \; || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iphone-e2e-${{ matrix.shard }}
          path: |
            ${{ env.E2E_DIR }}/screenshots
            ${{ env.E2E_DIR }}/e2e.xcresult
            ${{ env.E2E_DIR }}/xcodebuild.log
            ${{ env.E2E_DIR }}/blimpd.log
            ${{ env.E2E_DIR }}/signals.log
            ${{ env.E2E_DIR }}/claude.args
            ${{ env.E2E_DIR }}/quiz.in
            ${{ env.E2E_DIR }}/trust.in
            ${{ env.E2E_DIR }}/perm.in
            ${{ env.E2E_DIR }}/zmx-logs
          if-no-files-found: warn
      # On the Mac, its simulator off again, for the memory.
      - name: Stop what the test started
        if: always()
        run: |
          ios/e2e/stop.sh
          [ "$RUNNER_ENVIRONMENT" != self-hosted ] || [ -z "$SIM" ] || xcrun simctl shutdown "$SIM" || true

  # Says whether this run uploads to TestFlight: only a v* tag, and only with all four secrets set
  # (ios/README.md, TestFlight). Otherwise a notice says why, and the testflight job is skipped.
  testflight-check:
    runs-on: ubuntu-latest
    outputs:
      upload: ${{ steps.check.outputs.upload }}
    steps:
      - id: check
        env:
          # Whether each secret is set, not the secret itself.
          HAS_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          HAS_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          WANT: ${{ inputs.testflight }}
        run: |
          missing=""
          [ "$HAS_KEY_ID" = true ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ "$HAS_ISSUER_ID" = true ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ "$HAS_KEY" = true ] || missing="$missing APP_STORE_CONNECT_KEY"
          [ "$HAS_TEAM_ID" = true ] || missing="$missing APPLE_TEAM_ID"
          upload=false
          # A manual run ("Run workflow") uploads too, so a branch can go to TestFlight before a release.
          if [[ "$GITHUB_REF" != refs/tags/v* && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::notice title=TestFlight::Not uploaded: only release tags (v*) and manual runs upload to TestFlight."
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$WANT" = false ]; then
            echo "::notice title=TestFlight::Not uploaded: this manual run said not to."
          elif [ -n "$missing" ]; then
            echo "::notice title=TestFlight::Not uploaded: these repository secrets aren't set:$missing. ios/README.md (TestFlight) says how."
          else
            upload=true
          fi
          [ -z "$missing" ] || echo "secrets not set:$missing"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

  # Archives the app, signed automatically with the App Store Connect API key, and uploads it to TestFlight.
  # Build number: this workflow's run number, which only goes up.
  testflight:
    needs: [testflight-check, kit-linux, app]
    if: needs.testflight-check.outputs.upload == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"
          xcodebuild -version
      - run: ios/install-xcodegen.sh
      # The .p8 key, base64 in the secret, as a file only this job can read; deleted at the end, whatever happens.
      - name: Write the API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          (umask 077 && printf '%s' "$KEY" | base64 --decode > "$key")
          echo "KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate
          # Unsigned: signing the archive made a new development certificate on every fresh runner, and
          # the account's limit stopped uploads. The export below signs it once, with Apple's
          # cloud-managed distribution certificate.
          xcodebuild -project Blimp.xcodeproj -scheme Blimp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/blimp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -80
          # The export signs only the entitlements each archived bundle's signature lists, and an unsigned archive lists
          # none: ad-hoc signatures with Release's (aps-environment production, the App Group) carry them over, or the
          # TestFlight build could never get notifications and its widgets could neither read the App Group's
          # server.json nor get a push token. Both are signed: the widget extension first, as nested code must be
          # signed before the app that holds it. Checked 2026-10-24: with it, the exported app has aps-environment.
          app="$RUNNER_TEMP/blimp.xcarchive/Products/Applications/blimp.app"
          appex="$app/PlugIns/BlimpWidgets.appex"
          went="$RUNNER_TEMP/release-widgets.entitlements"
          cp BlimpWidgets/BlimpWidgets.entitlements "$went"
          plutil -replace aps-environment -string production "$went"
          codesign --force --sign - --entitlements "$went" --timestamp=none --generate-entitlement-der "$appex"
          ent="$RUNNER_TEMP/release.entitlements"
          cp Blimp/Blimp.entitlements "$ent"
          plutil -replace aps-environment -string production "$ent"
          codesign --force --sign - --entitlements "$ent" --timestamp=none --generate-entitlement-der "$app"
          # The export keeps what these signatures list: without aps-environment no notifications or widget pushes,
          # without the App Group the widgets can't read the server's address.
          for b in "$app" "$appex"; do
            name=$(basename "$b")
            if ! codesign -d --entitlements - --xml "$b" 2>/dev/null | grep aps-environment >/dev/null; then
              echo "::warning title=TestFlight::The archived $name's signature doesn't list aps-environment: this build may get no notifications or widget pushes."
            fi
            if ! codesign -d --entitlements - --xml "$b" 2>/dev/null | grep com.apple.security.application-groups >/dev/null; then
              echo "::warning title=TestFlight::The archived $name's signature doesn't list the App Group: this build's widgets may not read the server's address."
            fi
          done
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          opts="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/ExportOptions.plist "$opts"
          plutil -insert teamID -string "$TEAM_ID" "$opts"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/blimp.xcarchive" \
            -exportOptionsPlist "$opts" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -80
          echo "::notice title=TestFlight::Uploaded build $GITHUB_RUN_NUMBER of ${GITHUB_REF_NAME}. App Store Connect shows it once it has processed it."
      - name: Delete the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
