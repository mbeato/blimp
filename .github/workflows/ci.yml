name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Actions pinned to commits and tool versions as in release.yml, so CI tests what ships.
permissions:
  contents: read

jobs:
  blimpd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install
      # The server tests run real zmx sessions. Same pinned release and checksum as install.sh.
      - name: Install zmx
        run: |
          f=zmx-0.8.1-linux-x86_64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/neurosnap/zmx/releases/download/v0.8.1/$f"
          echo "dfd75720b942466f28870731cc86dbc07afa72fb8f3bd5eeb4ff707e4eecebe8  $RUNNER_TEMP/$f" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" zmx
          install -D -m 755 "$RUNNER_TEMP/zmx" "$HOME/.local/bin/zmx"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Only blimpd's tests; the app's tests run in app-macos, where its packages are installed.
      # One file at a time: with --parallel on this 4-core runner, two timing-sensitive tests failed (run
      # 40015725124). It's 1.6 min, and the iPhone e2e takes longer anyway; bun run test is parallel on yours.
      - run: bun test ./test
      - run: bun run build

  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-10-16)
        with:
          toolchain: 1.99.1
      # The crates compiled by the last run with this Cargo.lock, from the Actions cache (CI only:
      # release.yml builds from nothing, so nothing a CI run left can reach what ships).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: cargo-app-macos-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-app-macos-
      - name: Test and build the app
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run tauri build --bundles app,dmg -c '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blimp-macos-dmg
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  app-linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-10-16)
        with:
          toolchain: 1.99.1
          components: clippy
      # The crates compiled by the last run with this Cargo.lock, from the Actions cache (CI only:
      # release.yml builds from nothing, so nothing a CI run left can reach what ships).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: cargo-app-linux-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-app-linux-
      # The packages (64 MB) come from the Actions cache: a slow Ubuntu mirror once took 27 min to send them
      # (run 39841707069, 39 kB/s). A new cache each month, from the last one; apt fetches only what changed.
      - id: debs
        run: |
          echo "prefix=tauri-debs-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=tauri-debs-$ImageOS-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.debs.outputs.key }}
          restore-keys: ${{ steps.debs.outputs.prefix }}
      - name: Install Tauri's Linux libraries
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          # apt's own files out, and the rest readable by the cache's save (it runs as the runner's user)
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      # tauri::generate_context! needs frontendDist to exist; this job checks only the Rust side.
      - name: Placeholder UI build
        run: mkdir -p app/dist && echo '<!doctype html><title>blimp</title>' > app/dist/index.html
      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        working-directory: app/src-tauri
        run: cargo test --locked
